version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: stg_dealers
    columns:
      - name: dealer_id
        data_tests:
          - not_null
          - unique

  - name: stg_vehicles
    columns:
      - name: vehicle_id
        data_tests:
          - not_null
          - unique

      - name: vin
        data_tests:
          - not_null
          - unique

      - name: dealer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_dealers')
                field: dealer_id

  - name: stg_loans
    columns:
      - name: loan_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: vehicle_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_vehicles')
                field: vehicle_id

      - name: dealer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_dealers')
                field: dealer_id

  - name: stg_payments
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique

      - name: loan_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_loans')
                field: loan_id